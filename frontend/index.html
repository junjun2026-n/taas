<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qionghai TaaS</title>
<style>
body{font-family:system-ui;margin:0;background:#eef3fa;color:#172033}main{max-width:1080px;margin:30px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 8px 30px #1d355720}header{display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:8px;margin:18px 0;border-bottom:1px solid #dde3ee}nav button{background:#e8eefb;color:#172033}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{padding:18px;background:#f6f8fc;border-radius:10px;margin:12px 0}input,button{padding:11px;margin:5px;border:1px solid #ccd5e4;border-radius:8px}button{background:#2563eb;color:#fff;cursor:pointer}.danger{background:#dc2626}.hidden{display:none}.muted{color:#65728a}.key{word-break:break-all;background:#eaf2ff;padding:8px}
</style>
</head>
<body><main>
<section id="auth"><h1>Qionghai TaaS</h1><h2 id="title">登录</h2><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码"><input id="display" class="hidden" placeholder="显示名称"><input id="email" class="hidden" placeholder="邮箱"><br><button id="submitAuth">提交</button><button id="switchAuth">注册账号</button><p id="msg"></p></section>
<section id="app" class="hidden"><header><h1>Qionghai TaaS</h1><button id="logout">退出登录</button></header><p id="welcome"></p><nav><button id="portalTab">客户门户</button><button id="adminTab" class="hidden">后台管理</button></nav><div id="portal"></div><div id="admin" class="hidden"></div></section>
</main>
<script>
let registering=false, token=localStorage.getItem('taasToken')||'', data=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})},...opt});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d;}
function toggleAuth(){registering=!registering;$('title').textContent=registering?'注册':'登录';$('switchAuth').textContent=registering?'返回登录':'注册账号';$('display').classList.toggle('hidden',!registering);$('email').classList.toggle('hidden',!registering);}
async function submitAuth(){try{const payload={username:$('username').value,password:$('password').value,display_name:$('display').value,email:$('email').value};const result=await call(registering?'/api/auth/register':'/api/auth/login',{method:'POST',body:JSON.stringify(payload)});if(registering){$('msg').textContent='注册成功，请登录';toggleAuth();}else{token=result.token;localStorage.setItem('taasToken',token);await load();}}catch(e){$('msg').textContent=e.message;}}
async function load(){try{data=await call('/api/portal');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='欢迎，'+data.user.display_name+'（'+data.user.role+'）';if(data.user.role==='admin')$('adminTab').classList.remove('hidden');showTab(data.user.role==='admin'?'admin':'portal');}catch(e){localStorage.removeItem('taasToken');token='';$('msg').textContent=e.message;}}
function showTab(tab){$('portal').classList.toggle('hidden',tab!=='portal');$('admin').classList.toggle('hidden',tab!=='admin');if(tab==='portal')renderPortal();else renderAdmin();}
function renderPortal(){const keys=data.api_keys.map(k=>'<p><b>'+esc(k.name)+'</b> · '+k.quota_used+'/'+k.quota+' TOKEN <button class="danger" onclick="deleteKey('+k.id+')">删除</button></p>').join('')||'<p class="muted">暂无 API Key</p>';const packages=data.packages.map(p=>'<p><b>'+esc(p.name)+'</b> · ¥'+p.price+' · '+p.quota+' TOKEN <button onclick="buyPackage('+p.id+')">购买</button></p>').join('');const orders=(data.orders||[]).map(o=>'<p>'+esc(o.order_no)+' · ¥'+o.amount+' · '+o.status+(o.status==='pending'?' <button onclick="confirmOrder(\''+o.order_no+'\')">确认支付</button>':'')+'</p>').join('')||'<p class="muted">暂无订单</p>';$('portal').innerHTML='<div class="grid"><div class="card"><h3>创建 API Key</h3><input id="keyName" placeholder="名称"><input id="keyQuota" type="number" value="0"><button onclick="createKey()">创建</button></div><div class="card"><h3>账户信息</h3><p>用户名：'+esc(data.user.username)+'</p><p>余额：¥'+(data.user.balance||0)+'</p></div></div><div class="card"><h3>我的 API Keys</h3>'+keys+'</div><div class="card"><h3>可用套餐</h3>'+packages+'</div><div class="card"><h3>兑换码</h3><input id="redeemCode" placeholder="兑换码"><button onclick="redeem()">兑换</button></div><div class="card"><h3>订单</h3>'+orders+'</div><p id="portalMsg"></p>';}
async function createKey(){try{const d=await call('/api/portal/keys',{method:'POST',body:JSON.stringify({name:$('keyName').value,quota:Number($('keyQuota').value||0)})});$('portalMsg').innerHTML='创建成功，请保存：<div class="key">'+d.token+'</div>';}catch(e){$('portalMsg').textContent=e.message;}data=await call('/api/portal');renderPortal();}
async function deleteKey(id){await call('/api/portal/keys/'+id,{method:'DELETE'});data=await call('/api/portal');renderPortal();}
async function buyPackage(id){try{const o=await call('/api/portal/orders',{method:'POST',body:JSON.stringify({package_id:id})});$('portalMsg').textContent='订单已创建：'+o.order_no;}catch(e){$('portalMsg').textContent=e.message;}data=await call('/api/portal');renderPortal();}
async function confirmOrder(no){await call('/api/portal/orders/'+no+'/confirm',{method:'POST'});data=await call('/api/portal');renderPortal();}
async function redeem(){try{const d=await call('/api/portal/redeem',{method:'POST',body:JSON.stringify({code:$('redeemCode').value})});$('portalMsg').textContent='兑换成功，余额：'+d.balance;}catch(e){$('portalMsg').textContent=e.message;}data=await call('/api/portal');renderPortal();}
async function renderAdmin(){const [users,packs]=await Promise.all([call('/api/admin/users'),call('/api/admin/packages')]);$('admin').innerHTML='<div class="card"><h2>用户管理</h2><input id="newUser" placeholder="用户名"><input id="newPass" placeholder="初始密码"><button onclick="addUser()">新增用户</button>'+users.map(u=>'<p>'+esc(u.username)+' · '+esc(u.display_name)+' · '+esc(u.role)+'</p>').join('')+'</div><div class="card"><h2>套餐管理</h2><input id="packName" placeholder="名称"><input id="packPrice" type="number" placeholder="价格"><input id="packQuota" type="number" placeholder="配额"><button onclick="addPack()">新增套餐</button>'+packs.map(p=>'<p>'+esc(p.name)+' · ¥'+p.price+' · '+p.quota+' TOKEN <button class="danger" onclick="delPack('+p.id+')">删除</button></p>').join('')+'</div>';
}
async function addUser(){await call('/api/admin/users',{method:'POST',body:JSON.stringify({username:$('newUser').value,password:$('newPass').value})});renderAdmin();}
async function addPack(){await call('/api/admin/packages',{method:'POST',body:JSON.stringify({name:$('packName').value,price:Number($('packPrice').value),quota:Number($('packQuota').value),valid_days:30})});renderAdmin();}
async function delPack(id){await call('/api/admin/packages/'+id,{method:'DELETE'});renderAdmin();}
$('switchAuth').onclick=toggleAuth;$('submitAuth').onclick=submitAuth;$('logout').onclick=()=>{localStorage.removeItem('taasToken');location.reload();};$('portalTab').onclick=()=>showTab('portal');$('adminTab').onclick=()=>showTab('admin');if(token)load();
</script></body></html>
